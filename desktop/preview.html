<!doctype html><html><head><meta charset="utf-8"><title>Handwave preview</title><style>*{box-sizing:border-box}html,body{margin:0;background:#151217;overflow:hidden;font:12px Arial;color:white}.tile{-webkit-app-region:drag;position:relative;width:100vw;height:100vh;border:2px solid #151217;border-radius:14px;overflow:hidden}img{width:100%;height:100%;object-fit:cover;display:block}.legend{position:absolute;left:8px;bottom:8px;background:#151217cc;border-radius:8px;padding:5px 8px;font-weight:800;letter-spacing:.04em}.lime{color:#d9ff42}.blue{color:#6f8cff}.hide{-webkit-app-region:no-drag;position:absolute;right:7px;top:7px;width:25px;height:25px;border:0;border-radius:50%;background:#151217cc;color:white;font-weight:bold;cursor:pointer}</style></head><body><div class="tile"><img id="feed" alt="Camera preview"><button class="hide" id="hide" aria-label="Hide preview">×</button><div class="legend"><span class="lime">● CONTROL</span> &nbsp; <span class="blue">● SECOND</span></div></div><script>const feed=document.querySelector('#feed');document.querySelector('#hide').onclick=()=>window.handwavePreview.hide();window.handwavePreview.onFrame(image=>feed.src=`data:image/jpeg;base64,${image}`);</script></body></html>
