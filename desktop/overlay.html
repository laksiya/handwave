<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:transparent}.dot{position:fixed;width:24px;height:24px;border:3px solid #151217;border-radius:50%;translate:-50% -50%;display:none;filter:drop-shadow(0 2px 4px #0004)}#lime{background:#d9ff42}#blue{background:#4169f6}</style></head><body><div id="lime" class="dot"></div><div id="blue" class="dot"></div><script>const lime=document.querySelector('#lime'),blue=document.querySelector('#blue');function place(el,point){el.style.display=point?'block':'none';if(point){el.style.left=`${point.x*100}%`;el.style.top=`${point.y*100}%`}}window.handwaveOverlay.onMarkers(markers=>{place(lime,markers.lime);place(blue,markers.blue)});</script></body></html>
