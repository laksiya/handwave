<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handwave</title><style>:root{--ink:#151217;--paper:#f4f0e8;--acid:#d9ff42;--coral:#ff765d;--line:rgba(21,18,23,.16)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 Arial,sans-serif}.shell{max-width:760px;margin:auto;padding:42px 32px}.top,.row{display:flex;align-items:center;justify-content:space-between}.brand{font-size:26px;font-weight:900;letter-spacing:-.05em}.badge{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:700}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-right:7px}.badge.live .dot{background:#34b45b;box-shadow:0 0 0 4px #34b45b22}.hero{margin:52px 0 30px}.hero h1{font-size:46px;line-height:.95;letter-spacing:-.065em;margin:0 0 15px}.hero p{color:#625b62}.panel{background:white;border:1px solid var(--ink);border-radius:20px;padding:24px;box-shadow:8px 8px 0 #15121718}.controls{display:flex;gap:10px}button{border:1px solid var(--ink);border-radius:999px;padding:11px 17px;background:white;font-weight:800;cursor:pointer}button.primary{background:var(--ink);color:white}.metric{font-size:36px;font-weight:900;letter-spacing:-.05em}.muted{font-size:13px;color:#736b72}.settings{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}label{display:block;font-size:13px;font-weight:800}input{width:100%;margin-top:10px;accent-color:var(--ink)}.safety{margin-top:18px;background:var(--acid);border:1px solid var(--ink);border-radius:14px;padding:13px 15px;font-size:14px}.fault{color:#b52828}</style></head><body><main class="shell"><div class="top"><div class="brand">HW Handwave</div><div id="status" class="badge"><span class="dot"></span><span id="statusText">Starting engine…</span></div></div><section class="hero"><h1>Hand control,<br>running quietly.</h1><p>The tracking engine owns the camera and keeps its full speed when this window is minimized or hidden.</p></section><section class="panel"><div class="row"><div><div class="muted">Tracking speed</div><div><span id="fps" class="metric">—</span> fps</div><div id="gesture" class="muted">Waiting for a hand</div></div><div class="controls"><button id="pause">Pause</button><button id="restart" class="primary">Restart engine</button></div></div><div class="settings"><label>Stability <span id="stabilityValue">28</span>%<input id="stability" type="range" min="15" max="55" value="28"></label><label>Active area <span id="areaValue">76</span>%<input id="area" type="range" min="55" max="95" value="76"></label></div><div class="safety"><b>Open hand</b> moves · <b>closed fist</b> presses and drags · <b>Esc</b> pauses globally</div></section></main><script>const $=s=>document.querySelector(s),status=$('#status'),statusText=$('#statusText'),fps=$('#fps'),gesture=$('#gesture'),pause=$('#pause'),stability=$('#stability'),area=$('#area');let paused=false;function configure(){const active=Number(area.value)/100;window.handwaveDesktop.configure({smoothing_floor:Number(stability.value)/100,active_margin:(1-active)/2});$('#stabilityValue').textContent=stability.value;$('#areaValue').textContent=area.value}stability.oninput=configure;area.oninput=configure;pause.onclick=()=>{paused=!paused;window.handwaveDesktop[paused?'pause':'resume']();pause.textContent=paused?'Resume':'Pause'};$('#restart').onclick=()=>window.handwaveDesktop.restart();window.handwaveDesktop.onStatus(message=>{if(message.event==='ready'||message.event==='resumed'){status.className='badge live';statusText.textContent='Engine running';paused=false;pause.textContent='Pause'}if(message.event==='tracking'){fps.textContent=message.fps;gesture.textContent=message.hand?(message.gesture==='fist'?'Closed fist · pressing':'Open hand · moving'):'Looking for a hand'}if(message.event==='paused'){status.className='badge';statusText.textContent='Paused';paused=true;pause.textContent='Resume'}if(message.event==='fault'){status.className='badge';statusText.textContent='Needs attention';gesture.className='muted fault';gesture.textContent=message.message}});</script></body></html>
